spring:
  application:
    name: powerlifting-coach
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.1:8b
        options:
          temperature: 0.3

server:
  port: 8080

coach:
  video:
    storage-path: ./uploads
    fps: 5
    max-duration-seconds: 60
  pose:
    confidence-threshold: 0.5

logging:
  level:
    no.marius.coach: DEBUG
    org.springframework.ai: DEBUG

image:
  path: src/main/resources/images/

---

spring:
  config:
    activate:
      on-profile: local
  docker:
    compose:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

---

spring:
  config:
    activate:
      on-profile: docker
  docker:
    compose:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/coach
    username: coach
    password: coach
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration